name: hovede

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hovede
      POSTGRES_USER: hovede
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hovede_demo_local}
    volumes:
      - postgres_datos:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hovede -d hovede"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - .env.example
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: hovede
      DB_USER: hovede
      DB_PASSWORD: ${DB_PASSWORD:-hovede_demo_local}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_datos: